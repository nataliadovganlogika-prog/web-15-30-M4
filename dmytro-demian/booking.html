<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення | Карпатська Джерельна™</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Карпатська Джерельна™</div>
        
        <nav class="nav-menu" id="navMenu">
            <a href="index.html">Головна</a>
            <a href="#">Каталог</a>
            <a href="#">Галерея</a>
            <a href="booking.html" class="active">Замовити</a>
        </nav>
    </header>
    <section class="parallax booking-section">
        <div class="booking-form-container">
            <h2>Замовити</h2>
            <p class="form-description">Очікуйте дзвінок від менеджера</p>
            <form action="#" method="POST" id="bookingForm">
                <div class="form-group">
                    <label for="name">Ваше повне ім'я</label>
                    <input type="text" id="name" name="name" required placeholder="Дмитро Дем'янович">
                </div>
                
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="date">Дата замовлення</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group form-group-half">
                        <label for="time">Бажаний час</label>
                        <input type="time" id="time" name="time" min="09:00" max="22:00" required>
                    </div>
                </div>

                <button type="button" class="btn btn-full" aria-required="false">Підтвердити замовлення</button>
            </form>
        </div>
    </section>  
    <footer>
        <p>2026 Карпатська Джерельна.</p>
    </footer>
</body>
</html>
